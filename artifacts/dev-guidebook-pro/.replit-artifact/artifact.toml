kind = "web"
previewPath = "/dev-guidebook-pro/"
title = "Dev Guidebook Pro"
version = "1.0.0"
id = "artifacts/dev-guidebook-pro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dev-guidebook-pro/" ]
localPort = 22006

[services.development]
run = "pnpm --filter @workspace/dev-guidebook-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dev-guidebook-pro", "run", "build" ]
publicDir = "artifacts/dev-guidebook-pro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22006"
BASE_PATH = "/dev-guidebook-pro/"
